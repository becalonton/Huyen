<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />

  <title>Infinite White Board Carousel</title>

  <link rel="stylesheet" href="style.css" />

  <script defer src="https://cdn.jsdelivr.net/npm/animejs@4.2.2/dist/bundles/anime.umd.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>

  <main>

  <div class="section">
    <div class="content">
      <h1>Becalonton</h1>
      <a href="https://www.linkedin.com/in/aringuyenn/" target="_blank" rel="linkedIn">
        LinkedIn
      </a>
      <a href="https://www.linkedin.com/in/aringuyenn/" target="_blank" rel="linkedIn">
        LinkedIn
      </a>
      <a href="https://www.linkedin.com/in/aringuyenn/" target="_blank" rel="linkedIn">
        LinkedIn
      </a>
    </div>
    <div>
      
     </div>

  </div>

  <div class="carousel-viewport" aria-label="Infinite white board carousel">
    <div class="carousel-track" role="list" aria-label="White boards">
      <img alt="picture" src="https://as1.ftcdn.net/v2/jpg/15/25/21/46/1000_F_1525214651_g3LaPU4o97xqP71X9qJE4zGXYqm5Uw6p.jpg" class="board" role="listitem"></img>
      <img alt="picture" src="https://cdn.dribbble.com/userupload/47696056/file/392c92f76a9561c924fd46f008a270af.jpg" class="board" role="listitem"></img>
      <img alt="picture" src="https://img.magnific.com/premium-psd/multiple-app-screen-showcase-mockup_772836-1819.jpg?semt=ais_hybrid&w=740&q=80" class="board" role="listitem"></img>
    </div>
  </div>

  


 <!-- Floating Tab Bar -->
 <nav class="floating-bar" id="floating-bar" aria-label="Main navigation">

  <div class="tabs" id="tabs">

    <!-- Sliding Indicator -->
    <div class="active-indicator" id="active-indicator"></div>

    <!-- Home -->
    <button class="tab active" data-tab="home" aria-label="Home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.8 12 3l9 7.8"></path>
        <path d="M5.5 9.5V21h13V9.5"></path>
        <path d="M9.5 21v-7h5v7"></path>
      </svg>
      <span class="tab-label">Home</span>
    </button>

    <!-- Explore -->
    <button class="tab" data-tab="explore" aria-label="Explore">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="m15.8 8.2-2.5 5.1-5.1 2.5 2.5-5.1z"></path>
      </svg>
      <span class="tab-label">Explore</span>
    </button>

    <!-- Favorites -->
    <button class="tab" data-tab="favorites" aria-label="Favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.8 8.8c0 4.5-8.8 10-8.8 10s-8.8-5.5-8.8-10A4.8 4.8 0 0 1 12 6.4a4.8 4.8 0 0 1 8.8 2.4Z"></path>
      </svg>
      <span class="tab-label">Favorites</span>
    </button>

    <!-- Profile -->
    <button class="tab" data-tab="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21a8 8 0 0 1 16 0"></path>
      </svg>
      <span class="tab-label">Profile</span>
    </button>

  </div>

  <!-- Expand / Collapse -->
  <div
    id="toggle-button"
  >
  </div>

</nav>




  </main>
</body>
</html>
