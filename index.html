<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffbea">
  <title>Infinite Portfolio Carousel</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/animejs@4/dist/bundles/anime.umd.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow"></p>
      <h1>Becalonton.</h1>
      <p class="intro-copy">Scroll, drag, or use the arrows to explore.</p>
    </header>

    <section class="carousel" aria-label="Featured projects">
      <div class="carousel-viewport" id="carousel-viewport">
        <button class="board" type="button" data-index="0" aria-label="View digital banking project">
          <div class="board-surface">
            <img class="board-image" alt="" src="https://mir-s3-cdn-cf.behance.net/5b86da764c246c9f237afb80a16f920e/8982578b-8d50-4563-a80b-a382d8070f12_rwc_-2x2008x2710x500x2711.jpg?h=5bfe18f478637ea9cf6d121e0c2b1f06">
            <div class="board-shade"></div>
            <div class="board-content">
            </div>
            <span class="board-bottom"><span>Explore the work</span><span class="round-arrow">↗</span></span>
          </div>
        </button>

        <button class="board" type="button" data-index="1" aria-label="View research and strategy project">
          <div class="board-surface">
            <img class="board-image" alt="" src="https://as1.ftcdn.net/v2/jpg/15/25/21/46/1000_F_1525214651_g3LaPU4o97xqP71X9qJE4zGXYqm5Uw6p.jpg">
            <div class="board-shade"></div>
            <div class="board-content">
            </div>
            <span class="board-bottom"><span>Explore the work</span><span class="round-arrow">↗</span></span>
          </div>
        </button>

        <button class="board" type="button" data-index="2" aria-label="View design systems project">
          <div class="board-surface">
            <img class="board-image" alt="" src="https://as1.ftcdn.net/v2/jpg/15/25/21/46/1000_F_1525214651_g3LaPU4o97xqP71X9qJE4zGXYqm5Uw6p.jpg">
            <div class="board-shade"></div>
            <div class="board-content">
       
             
            </div>
            <span class="board-bottom"><span>Explore the work</span><span class="round-arrow">↗</span></span>
          </div>
        </button>
      </div>
<!--
      <nav class="carousel-controls" aria-label="Carousel controls">
        <button class="arrow-button" id="previous" type="button" aria-label="Previous project">←</button>
        <div class="pagination" aria-live="polite">
          <span id="current-index">01</span>
          <span class="pagination-line"></span>
          <span class="pagination-total">03</span>
        </div>
        <button class="arrow-button" id="next" type="button" aria-label="Next project">→</button>
      </nav>-->
    </section>

    <footer class="hint">CONTACT | LINKEDIN | RESUME</footer>
  </main>
  <script type="module" src="./script.js"></script>
</body>
</html>
